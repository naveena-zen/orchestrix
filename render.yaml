databases:
  - name: orchestrix-db
    databaseName: orchestrix
    user: orchestrix
    plan: free

services:
  - type: web
    name: orchestrix-fullstack
    env: node
    region: oregon # or whichever region you prefer
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npx prisma migrate deploy"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orchestrix-db
          property: connectionString
      - key: PORT
        value: 4000
